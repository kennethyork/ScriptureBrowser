// __NAME__ — AutoConfig.  Built __BUILT__.
//
// This file is one of the two places *this browser* is locked down; the other is
// distribution/policies.json, beside it in the clone.  It is read by Firefox
// before any profile is opened, so it applies to every profile this clone might
// use — including one made five minutes ago with `firefox -CreateProfile`.
//
// Nothing outside the clone is touched.  The machine's own Firefox has its own
// directory, its own profile and no idea any of this exists.
//
// lockPref() means locked: the setting cannot be changed in about:config, and a
// user.js in the profile cannot override it.  Only root can change this file.
// If it goes missing, the guard puts it back; see the README.

// ---------------------------------------------------------------- start page
lockPref("browser.startup.homepage", "__HOME__");
lockPref("browser.startup.page", 1);                  // 1 = the home page, always
lockPref("browser.newtabpage.enabled", false);        // a new tab is the home page
lockPref("browser.tabs.loadBookmarksInTabs", true);
lockPref("browser.startup.homepage_override.mstone", "ignore");
lockPref("startup.homepage_welcome_url", "");
lockPref("startup.homepage_welcome_url.additional", "");
lockPref("startup.homepage_override_url", "");
lockPref("browser.aboutwelcome.enabled", false);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("browser.messaging-system.whatsNewPanel.enabled", false);

// ------------------------------------------------------------- the url bar
// Nothing is guessed, nothing is suggested, and a phrase typed here does not
// quietly become a web search unless the allowlist says it may.
lockPref("keyword.enabled", __KEYWORD__);
lockPref("browser.urlbar.suggest.searches", false);
lockPref("browser.urlbar.suggest.history", false);
lockPref("browser.urlbar.suggest.bookmark", false);
lockPref("browser.urlbar.suggest.openpage", false);
lockPref("browser.urlbar.suggest.topsites", false);
lockPref("browser.urlbar.suggest.trending", false);
lockPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
lockPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
lockPref("browser.urlbar.quicksuggest.enabled", false);
lockPref("browser.urlbar.showSearchTerms.enabled", false);
lockPref("browser.urlbar.trimURLs", false);
lockPref("browser.search.suggest.enabled", false);
lockPref("browser.search.update", false);

// ------------------------------------------------- no telemetry, no spying
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("browser.ping-centre.telemetry", false);
lockPref("browser.discovery.enabled", false);
lockPref("extensions.pocket.enabled", false);
lockPref("extensions.getAddons.showPane", false);
lockPref("extensions.htmlaboutaddons.recommendations.enabled", false);
lockPref("browser.region.network.url", "");
lockPref("browser.region.update.enabled", false);
lockPref("browser.translations.enable", false);
lockPref("browser.translations.automaticallyPopup", false);

// ----------------------------------------- nothing on the new tab page but mine
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.showWeather", false);
lockPref("browser.newtabpage.activity-stream.default.sites", "");
lockPref("browser.newtabpage.activity-stream.feeds.system.topsites", false);
lockPref("browser.newtabpage.activity-stream.feeds.system.topstories", false);
lockPref("browser.newtabpage.activity-stream.feeds.system.weather", false);
lockPref("browser.newtabpage.activity-stream.feeds.snippets", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.highlights", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.section.highlights.includePocket", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
lockPref("browser.aboutConfig.showWarning", false);
lockPref("browser.uitour.enabled", false);

// ------------------------------------ no chatter the user did not ask for
// DNS-over-HTTPS off on purpose: the resolver the operating system was given is
// the one that decides, which is what makes the DNS filter in the README mean
// anything.
lockPref("network.trr.mode", 5);
lockPref("network.prefetch-next", false);
lockPref("network.dns.disablePrefetch", true);
lockPref("network.predictor.enabled", false);
lockPref("network.captive-portal-service.enabled", false);
lockPref("network.connectivity-service.enabled", false);
lockPref("beacon.enabled", false);
lockPref("geo.enabled", false);
lockPref("dom.webnotifications.enabled", false);
lockPref("dom.push.enabled", false);
lockPref("media.navigator.enabled", false);
lockPref("camera.control.face_detection.enabled", false);

// ---------------------------------------- every page goes through the filter
// The filter is an allow-list proxy on this machine (filter/filter.py).  It is
// locked on purpose, and failover_direct is off, so the failure mode is a
// browser that reaches nothing rather than a browser that reaches everything.
// localhost is passed through so the start page keeps working.
lockPref("network.proxy.type", 1);
lockPref("network.proxy.http", "__FILTER_HOST__");
lockPref("network.proxy.http_port", __FILTER_PORT__);
lockPref("network.proxy.ssl", "__FILTER_HOST__");
lockPref("network.proxy.ssl_port", __FILTER_PORT__);
lockPref("network.proxy.share_proxy_settings", true);
lockPref("network.proxy.no_proxies_on", "localhost, 127.0.0.1");
lockPref("network.proxy.allow_hijacking_localhost", false);
lockPref("network.proxy.failover_direct", false);

// ------------------------------------------------------------- the profile
lockPref("browser.privatebrowsing.autostart", false);
lockPref("browser.formfill.enable", false);
lockPref("signon.rememberSignons", false);
lockPref("signon.autofillForms", false);
lockPref("extensions.formautofill.addresses.enabled", false);
lockPref("extensions.formautofill.creditCards.enabled", false);
lockPref("browser.bookmarks.restore_default_bookmarks", false);
lockPref("browser.bookmarks.addedImportButton", false);
lockPref("browser.sessionstore.resume_from_crash", true);
lockPref("browser.download.useDownloadDir", false);
lockPref("browser.download.always_ask_before_handling_new_types", true);
lockPref("browser.download.autohideButton", false);
lockPref("devtools.policy.disabled", true);
lockPref("privacy.trackingprotection.enabled", true);
lockPref("privacy.trackingprotection.socialtracking.enabled", true);
lockPref("browser.contentblocking.category", "strict");

// ------------------------------------------------------- windows and popups
// The last tab cannot take the window with it, and a script cannot open a window
// just because something was clicked.
lockPref("browser.tabs.warnOnClose", false);
lockPref("browser.tabs.closeWindowWithLastTab", false);
lockPref("browser.warnOnQuit", false);
lockPref("dom.disable_open_during_load", true);
lockPref("dom.popup_allowed_events", "submit reset change");

// -------------------------------------------------- patched, but not by itself
// A clone must never update itself.  It is a copy, and the updater would write
// into files it shares with the machine's own Firefox — which is the one thing
// that must keep working.  Instead: the package manager patches the machine's
// Firefox as usual, and scripture-browser-sync notices the new version and
// re-vendors this clone from it.
lockPref("app.update.auto", false);
lockPref("app.update.enabled", false);
lockPref("app.update.background.scheduling.enabled", false);
lockPref("browser.search.update", false);
